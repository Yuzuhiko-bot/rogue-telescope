<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="筋トレのインターバルタイマー。ポップ＆カラフルなアメコミ風デザイン。">
<meta name="theme-color" content="#ffffff">
<title>モチベUPタイマー ポップ＆カラフル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #222222;
    --border-color: #222222;
    --color-30: #ffdd00; 
    --color-60: #00ddff; 
    --color-90: #a3de1b; 
    --color-120: #ff3377; 
  }
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
    text-shadow: none;
  }
  
  body {
    background-color: var(--bg-color);
    background-image: radial-gradient(#ffe6f0 15%, transparent 16%), radial-gradient(#ffe6f0 15%, transparent 16%);
    background-size: 24px 24px;
    background-position: 0 0, 12px 12px;
    color: var(--text-color);
    font-family: 'M PLUS Rounded 1c', 'Kosugi Maru', sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    padding: env(safe-area-inset-top, 5px) 0 env(safe-area-inset-bottom, 5px);
  }

  .tap-area {
    position: absolute;
    inset: 0;
    z-index: 1;
    cursor: pointer;
    pointer-events: none;
  }

  .app-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .header-area {
    flex: 0 0 auto;
    text-align: center;
    color: #ddd;
    font-size: 0.6rem;
    padding: 4px 0;
  }

  /* 1. タイマー表示エリア (さらに、さらに、薄く) */
  .timer-section {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2px 0; 
  }

  .timer-display {
    color: #ffffff; /* 文字の中身は白 */
    font-size: clamp(3rem, 13vh, 4.8rem);
    font-weight: 900;
    line-height: 0.9;
    
    /* 🌟 ここを追加：一番上の文字に直接黒いフチ取りをつける */
    -webkit-text-stroke: 3px var(--border-color); 

    /* 縁取りができた分、影のダブつきを無くしてスッキリさせます */
    text-shadow: 
      5px 5px 0 var(--border-color),
      10px 10px 0 var(--color-120), /* ピンクの影 */
      15px 15px 0 var(--color-60) !important; /* シアンの影 */
  }

  .tap-to-start {
    font-size: 0.75rem;
    color: var(--border-color);
    background-color: #ffffff;
    padding: 2px 10px;
    border-radius: 20px;
    border: 3px solid var(--border-color);
    margin-top: 5px;
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--border-color);
  }

  /* 2. キャラクター表示エリア (真の巨大化) */
  .character-section {
    flex: 1; /* 残りのスペースすべてをキャラへ */
    display: flex;
    justify-content: center;
    align-items: center; /* 中央に配置して存在感を出す */
    padding: 0;
    min-height: 0;
    position: relative;
  }
  
  .character-wrapper {
    width: 100%;
    height: 100%;
    /* 📱 画面の約 60% までキャラを表示可能に */
    max-height: 60vh; 
    display: flex;
    justify-content: center;
    align-items: center; 
  }

  .character-img {
    height: 100%; /* 親の高さ(60vh)いっぱいまで伸びる */
    width: auto;
    max-width: 100%;
    object-fit: contain;
    z-index: 10;
    filter: drop-shadow(0 5px 20px rgba(0,0,0,0.15));
    animation: floating 4s ease-in-out infinite;
    transform-origin: center center;
  }

  .character-img.hurry {
    filter: drop-shadow(0 0 25px rgba(255, 51, 119, 0.8)) contrast(1.1);
  }

  @keyframes floating {
    0%, 100% { transform: translateY(0) scale(1.0); }
    50% { transform: translateY(-12px) scale(1.03); }
  }

  /* 3. ボタンエリア (下部に固定) */
  .controls-section {
    flex: 0 0 auto;
    padding: 10px 0 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  .preset-btn {
    color: var(--text-color);
    border: 4px solid var(--border-color);
    border-radius: 16px;
    font-size: clamp(1.4rem, 6vh, 1.9rem);
    font-weight: 900;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 4px 4px 0 var(--border-color);
    position: relative;
    top: -4px;
    left: -4px;
    height: clamp(65px, 10vh, 90px);
    background-color: #fff;
  }

  .preset-btn[data-time="30"] { background-color: var(--color-30); }
  .preset-btn[data-time="60"] { background-color: var(--color-60); }
  .preset-btn[data-time="90"] { background-color: var(--color-90); }
  .preset-btn[data-time="120"] { background-color: var(--color-120); color: var(--text-color); }
  
  .btn-unit {
    font-size: 0.8rem;
    margin-top: -3px;
  }

  .preset-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0 var(--border-color);
  }
</style>
</head>
<body>

  <div class="tap-area" id="tap-area"></div>

  <div class="app-container">
    <div class="header-area">INTERVAL TIMER</div>

    <section class="timer-section">
      <div class="timer-display" id="time-display-text">00:00</div>
      <div class="tap-to-start">タップで開始 / 停止</div>
    </section>

    <section class="character-section">
      <div class="character-wrapper">
        <img src="character.png?v=6" alt="Character" class="character-img" id="character-img">
      </div>
    </section>

    <section class="controls-section">
      <button class="preset-btn" data-time="30">30<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="60">60<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="90">90<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="120">120<span class="btn-unit">SEC</span></button>
    </section>
  </div>

  <script>
    /**
     * 【要件1：データ構造の刷新】
     * 複数キャラクターおよび詳細なボイスパスを管理
     */
    const CHARACTER_DATA = {
      kurisu: {
        id: 'kurisu',
        name: '牧瀬紅莉栖',
        imageSrc: 'character.png?v=6', // 暫定的に現在の画像を使用
        voices: {
          patternA: [
            'voices/kurisu/a_01.mp3', 'voices/kurisu/a_02.mp3', 'voices/kurisu/a_03.mp3', 'voices/kurisu/a_04.mp3', 'voices/kurisu/a_05.mp3',
            'voices/kurisu/a_06.mp3', 'voices/kurisu/a_07.mp3', 'voices/kurisu/a_08.mp3', 'voices/kurisu/a_09.mp3', 'voices/kurisu/a_10.mp3'
          ],
          patternB: [
            'voices/kurisu/b_01.mp3', 'voices/kurisu/b_02.mp3', 'voices/kurisu/b_03.mp3', 'voices/kurisu/b_04.mp3', 'voices/kurisu/b_05.mp3',
            'voices/kurisu/b_06.mp3', 'voices/kurisu/b_07.mp3', 'voices/kurisu/b_08.mp3', 'voices/kurisu/b_09.mp3', 'voices/kurisu/b_10.mp3'
          ],
          patternC: [
            'voices/kurisu/c_01.mp3', 'voices/kurisu/c_02.mp3', 'voices/kurisu/c_03.mp3', 'voices/kurisu/c_04.mp3', 'voices/kurisu/c_05.mp3',
            'voices/kurisu/c_06.mp3', 'voices/kurisu/c_07.mp3', 'voices/kurisu/c_08.mp3', 'voices/kurisu/c_09.mp3', 'voices/kurisu/c_10.mp3'
          ],
          patternD: [
            'voices/kurisu/d_01.mp3', 'voices/kurisu/d_02.mp3', 'voices/kurisu/d_03.mp3', 'voices/kurisu/d_04.mp3', 'voices/kurisu/d_05.mp3',
            'voices/kurisu/d_06.mp3', 'voices/kurisu/d_07.mp3', 'voices/kurisu/d_08.mp3', 'voices/kurisu/d_09.mp3', 'voices/kurisu/d_10.mp3'
          ],
          countdown: {
            5: 'voices/kurisu/count_5.mp3',
            4: 'voices/kurisu/count_4.mp3',
            3: 'voices/kurisu/count_3.mp3',
            2: 'voices/kurisu/count_2.mp3',
            1: 'voices/kurisu/count_1.mp3'
          }
        }
      }
      // 将来的に他のキャラクターデータをここに追加可能
    };

    let activeCharId = 'kurisu';
    let timerId = null;
    let timeLeft = 0;
    let initialTime = 0; // 開始時の秒数を保持
    let isRunning = false;
    let wakeLock = null;

    const timeDisplay = document.getElementById('time-display-text');
    const buttons = document.querySelectorAll('.preset-btn');
    const characterImg = document.getElementById('character-img');

    /**
     * 【要件2：playVoice関数のアップデート】
     * パターンに応じたランダム再生および秒数指定再生
     */
    function playVoice(patternType, second = null) {
      const char = CHARACTER_DATA[activeCharId];
      if (!char || !char.voices) return;

      let voicePath = '';

      if (patternType === 'countdown' && second !== null) {
        // カウントダウン用の単一音声
        voicePath = char.voices.countdown[second];
      } else if (char.voices[patternType]) {
        // A, B, C, D パターンの配列からランダムに選択
        const voiceArray = char.voices[patternType];
        if (Array.isArray(voiceArray) && voiceArray.length > 0) {
          const randomIndex = Math.floor(Math.random() * voiceArray.length);
          voicePath = voiceArray[randomIndex];
        }
      }

      // 演出の維持：10秒以下ならhurryクラスを付与
      if (timeLeft <= 10 && timeLeft > 0) {
        characterImg.classList.add('hurry');
      } else {
        characterImg.classList.remove('hurry');
      }

      // 音声再生（パスが存在する場合のみ）
      if (voicePath) {
        const audio = new Audio(voicePath);
        audio.play().catch(e => console.log("Audio playback blocked or file not found:", voicePath));
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock Error:', err.message);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timeDisplay.textContent = formatTime(timeLeft);
    }

    /**
     * 【要件3：タイマーロジックの更新】
     * 指定されたタイミングで playVoice を発火
     */
    function startTimer(seconds) {
      clearInterval(timerId);
      timeLeft = seconds;
      initialTime = seconds;
      updateDisplay();
      isRunning = true;
      
      requestWakeLock();
      
      // 1. 開始直後：patternA
      playVoice('patternA'); 
      
      timerId = setInterval(() => {
        timeLeft--;

        if (timeLeft <= 0) {
          // 4. 0秒になった時：patternD
          clearInterval(timerId);
          timeLeft = 0;
          isRunning = false;
          releaseWakeLock();
          playVoice('patternD');
        } 
        else if (timeLeft >= 1 && timeLeft <= 5) {
          // 3. 残り時間が5秒〜1秒の時：毎秒 countdown を再生
          playVoice('countdown', timeLeft);
        }
        else if (timeLeft === 15) {
          // 2. 残り15秒の時：patternB
          playVoice('patternB');
        }
        else {
          // 5. 上記以外のタイミングで、開始から「15秒経過」するごとの時：patternC
          const elapsed = initialTime - timeLeft;
          if (elapsed > 0 && elapsed % 15 === 0) {
            playVoice('patternC');
          }
        }

        // 毎秒の表示更新とhurry演出チェック
        updateDisplay();
        if (timeLeft <= 10 && timeLeft > 0) {
          characterImg.classList.add('hurry');
        } else if (timeLeft > 10 || timeLeft === 0) {
          characterImg.classList.remove('hurry');
        }
      }, 1000);
    }

    function toggleTimer() {
      if (timeLeft <= 0) return;
      
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        releaseWakeLock();
        characterImg.classList.remove('hurry');
      } else {
        isRunning = true;
        requestWakeLock();
        
        // 再開時のボイス判定（簡易化のため現在の状態に応じて再生）
        if (timeLeft <= 5) playVoice('countdown', timeLeft);
        else if (timeLeft === 15) playVoice('patternB');
        else if (timeLeft <= 10) characterImg.classList.add('hurry');

        timerId = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(timerId);
            timeLeft = 0;
            isRunning = false;
            releaseWakeLock();
            playVoice('patternD');
          } 
          else if (timeLeft >= 1 && timeLeft <= 5) {
            playVoice('countdown', timeLeft);
          }
          else if (timeLeft === 15) {
            playVoice('patternB');
          }
          else {
            const elapsed = initialTime - timeLeft;
            if (elapsed > 0 && elapsed % 15 === 0) {
              playVoice('patternC');
            }
          }
          updateDisplay();
          if (timeLeft <= 10 && timeLeft > 0) {
            characterImg.classList.add('hurry');
          } else if (timeLeft > 10 || timeLeft === 0) {
            characterImg.classList.remove('hurry');
          }
        }, 1000);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        startTimer(parseInt(btn.getAttribute('data-time'), 10));
      });
    });

    document.body.addEventListener('click', toggleTimer);
  </script>
</body>
</html>
