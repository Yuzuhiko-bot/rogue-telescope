<!DOCTYPE html>
<!-- deploy: 20260417-124500 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Workout interval timer with a pop and colorful comic-style design.">
<meta name="theme-color" content="#ffffff">
<title>CheerPump Timer</title>
<link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #ffffff;
    --text-color: #222222;
    --border-color: #222222;
    --color-30: #ffdd00; 
    --color-60: #00ddff; 
    --color-90: #a3de1b; 
    --color-120: #ff3377; 
  }
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }
  
  body {
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(#ffcce0 15%, transparent 16%),
      radial-gradient(#ccffff 15%, transparent 16%),
      radial-gradient(#fff5cc 15%, transparent 16%),
      radial-gradient(#e0facc 15%, transparent 16%);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px, 20px 0, 0 20px;
    color: var(--text-color);
    font-family: 'M PLUS Rounded 1c', 'Kosugi Maru', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-y: auto;
    overflow-x: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    padding: env(safe-area-inset-top, 5px) 0 env(safe-area-inset-bottom, 5px);
  }

  .app-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    padding: 0 16px 30px;
  }

  .header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    color: #888;
    font-size: 0.7rem;
    font-weight: bold;
  }

  .mute-toggle {
    background: #fff;
    border: 3px solid var(--border-color);
    border-radius: 50%;
    width: 32px;
    height: 32px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--border-color);
    transition: all 0.1s;
    font-size: 1.1rem;
    user-select: none;
  }
  
  .mute-toggle.active {
    background: #eee;
    box-shadow: 0 0 0 transparent;
    transform: translate(2px, 2px);
  }

  .timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2px 0; 
  }

  .timer-display {
    color: #ffffff;
    font-size: clamp(3rem, 13vh, 4.8rem);
    font-weight: 900;
    line-height: 0.9;
    -webkit-text-stroke: 3px var(--border-color); 
    text-shadow: 
      5px 5px 0 var(--border-color),
      10px 10px 0 var(--color-120),
      15px 15px 0 var(--color-60);
  }

  .tap-to-start {
    font-size: 0.75rem;
    color: var(--border-color);
    background-color: #ffffff;
    padding: 2px 10px;
    border-radius: 20px;
    border: 3px solid var(--border-color);
    margin-top: 5px;
    font-weight: 900;
    box-shadow: 2px 2px 0 var(--border-color);
  }

  .character-section {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 150px;
    position: relative;
  }
  
  .character-img {
    height: auto;
    max-height: 55vh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 5px 20px rgba(0,0,0,0.15));
    animation: floating 4s ease-in-out infinite;
  }

  @keyframes floating {
    0%, 100% { transform: translateY(0) scale(1.0); }
    50% { transform: translateY(-12px) scale(1.03); }
  }

  .controls-section {
    padding: 10px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  
  .preset-btn {
    color: var(--text-color);
    border: 4px solid var(--border-color);
    border-radius: 16px;
    font-size: clamp(1.4rem, 6vh, 1.9rem);
    font-weight: 900;
    cursor: pointer;
    transition: all 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 4px 4px 0 var(--border-color);
    position: relative;
    top: -4px;
    left: -4px;
    height: clamp(65px, 10vh, 90px);
    background-color: #fff;
  }

  .preset-btn[data-time="30"] { background-color: var(--color-30); }
  .preset-btn[data-time="60"] { background-color: var(--color-60); }
  .preset-btn[data-time="90"] { background-color: var(--color-90); }
  .preset-btn[data-time="120"] { background-color: var(--color-120); }
  
  .btn-unit { font-size: 0.8rem; margin-top: -3px; }

  .preset-btn:active {
    transform: translate(4px, 4px);
    box-shadow: 0px 0px 0 var(--border-color);
  }

  @media (max-height: 500px) {
    .timer-display { font-size: clamp(2rem, 10vh, 3.5rem); }
    .preset-btn { height: clamp(50px, 8vh, 70px); font-size: 1.2rem; }
    .character-section { min-height: 120px; }
  }
</style>
</head>
<body>
  <div class="app-container">
    <div class="header-area">
      <div>CHEER-PUMP TIMER <span style="font-size: 0.8em; opacity: 0.7;">v4.6</span></div>
      <div id="mute-btn" class="mute-toggle">🔊</div>
    </div>

    <section class="timer-section">
      <div class="timer-display" id="time-display-text">00:00</div>
      <div class="tap-to-start">Tap: Start/Stop | Dbl-Tap: Reset</div>
    </section>

    <section class="character-section">
      <img src="./images/kurisu_v2_chibi.png?v=chibi" alt="Character" class="character-img" id="character-img">
    </section>

    <section class="controls-section">
      <button class="preset-btn" data-time="30">30<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="60">60<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="90">90<span class="btn-unit">SEC</span></button>
      <button class="preset-btn" data-time="120">120<span class="btn-unit">SEC</span></button>
    </section>

    <!-- Hidden Audio Pool v4.6 Dedicated Players -->
    <div id="audio-pool" style="display:none;">
      <audio id="silent-loop" loop src="voices/kurisu/silent_loop.mp3"></audio>
      <audio id="cd-5" preload="auto"></audio>
      <audio id="cd-4" preload="auto"></audio>
      <audio id="cd-3" preload="auto"></audio>
      <audio id="cd-2" preload="auto"></audio>
      <audio id="cd-1" preload="auto"></audio>
      <audio id="finish-voice" preload="auto"></audio>
    </div>
  </div>

  <script>
    const CHARACTER_DATA = {
      kurisu: {
        id: 'kurisu',
        name: 'Kurisu Makise',
        imageSrc: './images/kurisu_v2_chibi.png?v=chibi',
        voices: {
          patternA: ['voices/kurisu/a_01.mp3', 'voices/kurisu/a_02.mp3', 'voices/kurisu/a_03.mp3', 'voices/kurisu/a_04.mp3', 'voices/kurisu/a_05.mp3', 'voices/kurisu/a_06.mp3', 'voices/kurisu/a_07.mp3', 'voices/kurisu/a_08.mp3', 'voices/kurisu/a_09.mp3', 'voices/kurisu/a_10.mp3'],
          patternB: ['voices/kurisu/b_01.mp3', 'voices/kurisu/b_02.mp3', 'voices/kurisu/b_03.mp3', 'voices/kurisu/b_04.mp3', 'voices/kurisu/b_05.mp3', 'voices/kurisu/b_06.mp3', 'voices/kurisu/b_07.mp3', 'voices/kurisu/b_08.mp3', 'voices/kurisu/b_09.mp3', 'voices/kurisu/b_10.mp3'],
          patternC: ['voices/kurisu/c_01.mp3', 'voices/kurisu/c_02.mp3', 'voices/kurisu/c_03.mp3', 'voices/kurisu/c_04.mp3', 'voices/kurisu/c_05.mp3', 'voices/kurisu/c_06.mp3', 'voices/kurisu/c_07.mp3', 'voices/kurisu/c_08.mp3', 'voices/kurisu/c_09.mp3', 'voices/kurisu/c_10.mp3'],
          patternD: ['voices/kurisu/d_01.mp3', 'voices/kurisu/d_02.mp3', 'voices/kurisu/d_03.mp3', 'voices/kurisu/d_04.mp3', 'voices/kurisu/d_05.mp3', 'voices/kurisu/d_06.mp3', 'voices/kurisu/d_07.mp3', 'voices/kurisu/d_08.mp3', 'voices/kurisu/d_09.mp3', 'voices/kurisu/d_10.mp3'],
          countdown: { 5:'voices/kurisu/count_5.mp3', 4:'voices/kurisu/count_4.mp3', 3:'voices/kurisu/count_3.mp3', 2:'voices/kurisu/count_2.mp3', 1:'voices/kurisu/count_1.mp3' }
        }
      }
    };

    let activeCharId = 'kurisu';
    const voicePlayer = new Audio();
    voicePlayer.unlocked = false;
    let timerId = null;
    let timeLeft = 0;
    let initialTime = 0;
    let isRunning = false;
    let wakeLock = null;
    let timerEndTime = 0;
    let lastTapTime = 0;
    let isResuming = false;      
    let lastPlayedSec = -1;      
    let lastVoiceTime = 0;
    let isMuted = localStorage.getItem('isMuted') === 'true';

    const timeDisplay = document.getElementById('time-display-text');
    const buttons = document.querySelectorAll('.preset-btn');
    const muteBtn = document.getElementById('mute-btn');

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        isResuming = true;
      }
    });

    function updateMuteUI() {
      muteBtn.textContent = isMuted ? '🔇' : '🔊';
      muteBtn.classList.toggle('active', isMuted);
      localStorage.setItem('isMuted', isMuted);
    }
    updateMuteUI();

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isMuted = !isMuted;
      updateMuteUI();
      if (!isMuted) unlock();
    });

    function updateDisplay(sec) {
      timeDisplay.textContent = Math.floor(sec/60).toString().padStart(2,'0') + ":" + (sec%60).toString().padStart(2,'0');
    }

    // v4.6 Stop all players except for the tail of countdown/finish
    function stopAllVoice(keepCount = false) {
      voicePlayer.pause(); voicePlayer.currentTime = 0;
      if (!keepCount) {
        for(let i=1; i<=5; i++){
          const p = document.getElementById('cd-'+i);
          if(p) { p.pause(); p.currentTime = 0; }
        }
      }
      const sl = document.getElementById('silent-loop');
      if(sl) sl.pause();
      // Keep finish-voice playing if it was just started
      if (!keepCount) {
        const fv = document.getElementById('finish-voice');
        if(fv) { fv.pause(); fv.currentTime = 0; }
      }
    }

    // v4.6 Pre-arm countdown and finish voices for zero-latency playback
    function preArmVoices(charId) {
      const char = CHARACTER_DATA[charId];
      if(!char) return;
      for(let i=1; i<=5; i++){
        const p = document.getElementById('cd-'+i);
        if(p) { p.src = char.voices.countdown[i]; p.load(); }
      }
      const fv = document.getElementById('finish-voice');
      if(fv) {
        const arr = char.voices.patternD;
        fv.src = arr[Math.floor(Math.random() * arr.length)];
        fv.load();
      }
    }

    function playVoice(type, sec = null) {
      if (isMuted) return;
      if (type === 'countdown' && sec === lastPlayedSec) return;
      
      const char = CHARACTER_DATA[activeCharId];
      const now = Date.now();
      
      if (now - lastVoiceTime < 200) return;
      lastVoiceTime = now;

      // v4.6 Use pre-armed players for countdown and finish
      if (type === 'countdown' && sec !== null) {
        lastPlayedSec = sec;
        const cp = document.getElementById('cd-'+sec);
        if (cp) { cp.play().catch(()=>{}); return; }
      }
      
      if (type === 'patternD') {
        const fv = document.getElementById('finish-voice');
        if (fv) { fv.play().catch(()=>{}); return; }
      }

      const arr = char.voices[type];
      const path = arr[Math.floor(Math.random() * arr.length)];
      if (path) {
        voicePlayer.src = path;
        voicePlayer.play().catch(()=>{});
      }
    }

    function tick() {
      const now = Date.now();
      const diffMs = timerEndTime - now;
      const diffSec = Math.ceil(diffMs / 1000);

      if (diffMs <= 0) {
        clearInterval(timerId); timerId = null; isRunning = false;
        timeLeft = 0; updateDisplay(0);
        const sl = document.getElementById('silent-loop');
        if(sl && !isMuted) sl.play().catch(()=>{});
        playVoice('patternD');
        if(wakeLock) { wakeLock.release(); wakeLock = null; }
        updateMediaSession();
        isResuming = false;
        return;
      }

      const hasJumped = (Math.abs(diffSec - timeLeft) > 1);

      if (diffSec !== timeLeft) {
        const catchUp = (isResuming || hasJumped);
        timeLeft = diffSec;
        updateDisplay(timeLeft);
        
        if (!catchUp) {
          if (timeLeft <= 5 && timeLeft > 0) { playVoice('countdown', timeLeft); }
          else if (timeLeft === 15) { playVoice('patternB'); }
          else if ((initialTime - timeLeft) % 15 === 0 && timeLeft !== initialTime) { playVoice('patternC'); }
        } else {
          lastPlayedSec = timeLeft;
        }
        isResuming = false; 
      }
    }

    function startTimer(sec) {
      clearInterval(timerId); stopAllVoice();
      timeLeft = sec; initialTime = sec; isRunning = true;
      timerEndTime = Date.now() + sec * 1000;
      lastPlayedSec = -1;
      updateDisplay(timeLeft);
      preArmVoices(activeCharId); // v4.6 Load voices immediately
      playVoice('patternA');
      const sl = document.getElementById('silent-loop');
      if(sl && !isMuted) sl.play().catch(()=>{});
      if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(()=>{});
      timerId = setInterval(tick, 50);
      updateMediaSession();
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerId); timerId = null; isRunning = false; stopAllVoice();
      } else {
        if (timeLeft <= 0 && initialTime > 0) {
          startTimer(initialTime);
        } else if (timeLeft > 0) {
          isRunning = true; timerEndTime = Date.now() + timeLeft * 1000;
          isResuming = true; 
          preArmVoices(activeCharId); // Ensure armed
          const sl = document.getElementById('silent-loop'); if(sl && !isMuted) sl.play().catch(()=>{});
          timerId = setInterval(tick, 50);
        }
      }
      updateMediaSession();
    }

    function resetTimer() {
      clearInterval(timerId); timerId = null; isRunning = false; stopAllVoice();
      timeLeft = initialTime;
      updateDisplay(timeLeft);
      if(wakeLock) { wakeLock.release(); wakeLock = null; }
      updateMediaSession();
    }

    function unlock() {
      if(!voicePlayer.unlocked) {
        const sil = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAAAD';
        const players = [document.getElementById('silent-loop'), voicePlayer, document.getElementById('finish-voice')];
        for(let i=1; i<=5; i++) players.push(document.getElementById('cd-'+i));

        players.forEach(p => {
          if (p) {
            if (!p.src || p.src.startsWith('data:') || p.src === window.location.href) {
                p.src = sil;
            }
            p.play().then(()=>p.pause()).catch(()=>{});
          }
        });
        voicePlayer.unlocked = true;
      }
    }

    buttons.forEach(b => b.addEventListener('click', (e) => { 
      e.stopPropagation(); unlock(); startTimer(parseInt(b.dataset.time)); 
    }));

    document.body.addEventListener('click', (e) => {
      const now = Date.now();
      const delay = now - lastTapTime;
      lastTapTime = now;
      if (delay < 300 && delay > 0) { resetTimer(); }
      else {
        setTimeout(() => { if (Date.now() - lastTapTime >= 280) { unlock(); toggleTimer(); } }, 300);
      }
    });

    function updateMediaSession() {
      if ('mediaSession' in navigator) {
        const title = isRunning ? 'CheerPump Timer' : '【終了】タップでおかわり';
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title, 
          artist: 'Kurisu Makise', 
          album: 'Workout Buddy',
          artwork: [{ src: './images/kurisu_v2_chibi.png?v=chibi', sizes: '512x512', type: 'image/png' }]
        });
        navigator.mediaSession.playbackState = isRunning ? 'playing' : 'paused';
      }
    }

    if ('mediaSession' in navigator) {
      updateMediaSession();
      navigator.mediaSession.setActionHandler('play', toggleTimer);
      navigator.mediaSession.setActionHandler('pause', toggleTimer);
    }
  </script>
</body>
</html>
